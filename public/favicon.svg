<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1109" />
      <stop offset="100%" stop-color="#0a0502" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e85a2d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#e85a2d" stop-opacity="0.2" />
    </linearGradient>

    <!-- Ember Dot Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Luxury Obsidian Squircle Base -->
  <rect 
    x="2" 
    y="2" 
    width="60" 
    height="60" 
    rx="16" 
    fill="url(#bgGrad)" 
    stroke="url(#borderGrad)" 
    stroke-width="2" 
  />

  <!-- Subtle Radial Atmosphere -->
  <circle cx="20" cy="18" r="16" fill="#e85a2d" opacity="0.12" />

  <!-- Iconic Editorial Monogram "S" -->
  <path 
    d="M38 21.5 C36.5 19 33 17.5 28.5 17.5 C22.5 17.5 18 21 18 26 C18 31 22.5 33.5 28 35.2 C34.5 37.2 38.5 39.5 38.5 45 C38.5 50.8 33.5 55 26.5 55 C20.5 55 16 52 14.5 47.5" 
    fill="none" 
    stroke="#f8f5ee" 
    stroke-width="5.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- Signature Glowing Terracotta Ember Dot -->
  <circle 
    cx="48" 
    cy="49.5" 
    r="4" 
    fill="#e85a2d" 
    filter="url(#glow)" 
  />
  <circle 
    cx="48" 
    cy="49.5" 
    r="2.2" 
    fill="#ffedd5" 
  />
</svg>
